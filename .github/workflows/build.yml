name: QLCplus Github Actions CI Build

on:
  push:
  pull_request:
  # Lets a run be started from the Actions tab / `gh workflow run` without
  # having to invent a commit. This workflow sat unregistered with GitHub for
  # weeks; being able to fire it on demand makes that state easy to spot.
  workflow_dispatch:

jobs:
  build-linux:
    #if: false
    runs-on: ubuntu-22.04
    name: QLCplus Linux ${{matrix.task}}
    strategy:
      # Not fail-fast: coverage-build-v4 has been cancelled behind build-v4 in
      # every run this repo has ever had, so it has never actually executed.
      fail-fast: false
      matrix:
        # No build-v5: it configures qmlui=ON, which this fork keeps OFF and
        # never carried the rebrand through. It could only ever be red -- and
        # with fail-fast on it was cancelling build-v4 and coverage-build-v4
        # every run, so the jobs that actually matter never reported.
        task: [build-v4, coverage-build-v4]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      CC: gcc
      CXX: g++
      PACKAGES_BASE:
        gdb
        libasound2-dev
        libusb-1.0-0-dev
        libftdi1-dev
        shared-mime-info
        libudev-dev
        libmad0-dev
        libsndfile1-dev
        liblo-dev
        libfftw3-dev
        libgl1-mesa-dev
        libxml2-utils
        xvfb
        chrpath
        libfuse2
        wget
      PACKAGES_V5_BASE:
        libpulse-dev
      PACKAGES_COVERAGE_BASE:
        lcov

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          # APPVERSION counts commits since the fork point; the default shallow
          # clone yields 0, so artifacts came out as "...+qlcconsole.0".
          fetch-depth: 0

      - name: Set General ENV variables
        run: |
          echo "PACKAGES_V4=$(echo ${PACKAGES_BASE})" >> $GITHUB_ENV
          echo "PACKAGES_V5=$(echo ${PACKAGES_BASE} ${PACKAGES_V5_BASE})" >> $GITHUB_ENV
          echo "PACKAGES_COVERAGE=$(echo ${PACKAGES_BASE} ${PACKAGES_V4_BASE} ${PACKAGES_COVERAGE_BASE})" >> $GITHUB_ENV
          echo "PACKAGES_ALL=$(echo ${PACKAGES_BASE} ${PACKAGES_V5_BASE} ${PACKAGES_COVERAGE_BASE})" >> $GITHUB_ENV
          echo "CI_BRANCH=$(echo $GITHUB_REF | cut -d '/' -f 3)" >> $GITHUB_ENV
          echo "CI_SECURE_ENV_VARS=$(if [ -z '${{ secrets.something }}' ]; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_ENV
          echo "CI_EVENT_TYPE=$(if [ 'schedule' == '${{ github.event_name }}' ]; then echo 'cron'; else echo '${{ github.event_name }}'; fi)" >> $GITHUB_ENV
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "TASK=$(echo '${{matrix.task}}' | cut -d '-' -f 2)" >> $GITHUB_ENV
          echo "INSTALL_ROOT=`pwd`/install_root" >> $GITHUB_ENV
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV

      - name: Set Qt ENV variables (v4)
        if: ${{ endsWith( matrix.task, 'v4') }}
        run: |
          echo "QT=${QT:-$(echo '${{matrix.task}}' | cut -d '-' -f 2)}" >> $GITHUB_ENV
          echo "QT_INSTALL_DIR=/opt" >> $GITHUB_ENV
          echo "QT_VERSION=6.8.1" >> $GITHUB_ENV
          source $GITHUB_ENV && echo "QTDIR=${QT_INSTALL_DIR}/Qt/${QT_VERSION}/gcc_64" >> $GITHUB_ENV
          source $GITHUB_ENV && echo "QMAKE=${QTDIR}/bin/qmake" >> $GITHUB_ENV

      - name: Print ENV vars
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "PACKAGES_V4: ${PACKAGES_V4}"
          echo "PACKAGES_V5: ${PACKAGES_V5}"
          echo "PACKAGES_COVERAGE: ${PACKAGES_COVERAGE}"
          echo "TASK: ${TASK}"
          echo "QT: ${QT}"
          echo "NPROC: ${NPROC}"

      - name: Download, cache and install packages
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: ${{env.PACKAGES_ALL}}
          version: ${{runner.os}}-apt

      - name: Install Qt through aqt (and python)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          dir: ${{ env.QT_INSTALL_DIR }}
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets qtshadertools'

      - name: Install python-lxml for fixtures-tool # with the now-registered aqt python
        run: pip install lxml

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: Setup ruby cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      - name: Install coveralls-lcov
        if: ${{ startsWith( matrix.task, 'coverage') }}
        run: sudo gem install coveralls-lcov

      - name: Print program versions and username
        run: |
          echo "CXX:"
          ${CXX} --version
          echo "QMAKE:"
          ${QMAKE} -v
          echo "Python:"
          python --version
          echo "WHOAMI:"
          whoami

      - name: Configure for v4 build
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QTDIR/lib/cmake/" -Dappimage=ON -DINSTALL_ROOT=${INSTALL_ROOT} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure for coverage build
        if: ${{ matrix.task == 'coverage-build-v4' }}
        run: |
          cmake -DCMAKE_PREFIX_PATH="/opt/Qt/$QT_VERSION/gcc_64/lib/cmake" -Dcoverage=ON -DINSTALL_ROOT=${INSTALL_ROOT} -B build

      - name: Build
        run: cmake --build build --parallel `nproc`

      - name: Test
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: cmake --build build --target check

      - name: Test with Coverage
        if: ${{ startsWith( matrix.task, 'coverage') }}
        run: cmake --build build --target lcov

      - name: Coveralls
        if: ${{ startsWith( matrix.task, 'coverage') }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.info
          format: lcov

      - name: Install
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: |
          cmake --build build --target install
          cp -v resources/icons/svg/qlcconsole.svg ${INSTALL_ROOT}
          cp -v platforms/linux/qlcconsole.desktop ${INSTALL_ROOT}

      - name: Set APPVERSION
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: |
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Adapt qlcconsole for AppImage (v4)
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          chrpath -r "../lib" ${INSTALL_ROOT}/usr/bin/qlcconsole

      - name: Store original install artifacts before stripping and AppImage
        # Activate for debugging
        if: ${{ false && ! startsWith( matrix.task, 'coverage') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}-files
          path: ${{ env.INSTALL_ROOT }}

      - name: Strip Binaries (v4)
        if: ${{ matrix.task == 'build-v4' }}
        run: |
          strip -v ${INSTALL_ROOT}/usr/bin/qlcconsole
          find ${INSTALL_ROOT}/usr/lib/ -name libqlcplusengine.so.1.0.0 -exec strip -v {} \;

      - name: Delete unused files for AppImage
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: |
          find ${INSTALL_ROOT}/usr/bin/ -name plugins.qmltypes -type f -delete
          find ${INSTALL_ROOT}/usr/bin -name *.qmlc -type f -delete
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Extras QtQuick/Particles.2 QtQuick/XmlListModel
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/designer QtQuick/Controls.2/Material
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/Universal QtQuick/Controls.2/Fusion
          rm -rf ${INSTALL_ROOT}/usr/bin/QtQuick/Controls.2/Imagine QtQuick/Controls.2/Scene2D

      - name: Build AppImage
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        run: |
          wget -c https://github.com/AppImage/AppImageKit/releases/download/continuous/AppRun-x86_64 -O ${INSTALL_ROOT}/AppRun
          chmod a+x ${INSTALL_ROOT}/AppRun
          # Download the tool OUTSIDE the working directory: it is itself named
          # *-x86_64.AppImage, so leaving it here makes the glob below match two
          # files and mv then wants a destination directory.
          wget -c https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O "${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          chmod a+x "${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          "${RUNNER_TEMP}/appimagetool-x86_64.AppImage" -v ${INSTALL_ROOT}
          mv -v *-x86_64.AppImage qlcconsole-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.AppImage

      - name: Store AppImage artifacts
        if: ${{ ! startsWith( matrix.task, 'coverage') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}-AppImage
          path: qlcconsole-${{env.TASK}}-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.AppImage


  build-windows:
    runs-on: windows-2025
    name: QLCplus Windows ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        # Widgets UI only, as on macOS and Linux.
        task: [build-v4]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      # windeployqt + cmake --install stage the app here (INSTALLROOT in
      # variables.cmake is $SystemDrive/qlcconsole on Windows).
      DEPLOY_DIR: /c/qlcconsole

    # Toolchain: MSYS2 UCRT64 with MSYS2's own Qt 6 packages, not aqt's
    # win64_mingw Qt. Everything -- compiler, Qt, libsndfile/fftw/libusb --
    # then comes from one place, built by one GCC: no MinGW ABI mismatch
    # between aqt's bundled MinGW and MSYS2's newer GCC, and Qt's private
    # headers (GuiPrivate, for QRhi) and ShaderTools (qt_add_shaders) are
    # just packages. The cost is that MSYS2's Qt links shared system libs
    # (ICU, harfbuzz, ffmpeg, ...), which windeployqt does not copy -- the
    # deploy step sweeps them in with ldd.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          # APPVERSION counts commits since the fork point.
          fetch-depth: 0

      - name: Install MSYS2 (UCRT64) and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: true
          update: true
          install: >-
            git
            wget
            unzip
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            ccache:p
            pkgconf:p
            tools-git:p
            qt6-base:p
            qt6-declarative:p
            qt6-imageformats:p
            qt6-multimedia:p
            qt6-serialport:p
            qt6-shadertools:p
            qt6-svg:p
            qt6-tools:p
            qt6-translations:p
            qt6-websockets:p
            libmad:p
            libsndfile:p
            flac:p
            fftw:p
            libusb:p
            python-lxml:p
            libxml2:p
            nsis:p

      - name: Set ENV variables
        run: |
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV
          echo "QLCCONSOLE_VERSION=`head -n1 VERSION | tr -d '\r'`" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.task }}

      - name: D2XX SDK (64 bit)
        run: |
          mkdir -p /c/projects/D2XXSDK
          wget -q https://qlcplus.org/misc/CDM-v2.12.36.20-WHQL-Certified.zip -O /c/projects/D2XXSDK/cdm.zip
          cd /c/projects/D2XXSDK
          unzip -q cdm.zip
          cd amd64
          gendef.exe - ftd2xx64.dll > ftd2xx.def
          dlltool -k --input-def ftd2xx.def --dllname ftd2xx64.dll --output-lib libftd2xx.a

      - name: Print program versions
        run: |
          echo "MSYSTEM: ${MSYSTEM}"
          g++ --version
          cmake --version
          ninja --version
          qtpaths6 --qt-version || qmake6 -query QT_VERSION || true
          pkg-config --modversion libusb-1.0 sndfile fftw3
          ccache --version || true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        # -k 0: on a broken build, report every failing file in one run
        # instead of stopping at the first.
        run: cmake --build build -- -k 0

      - name: Install
        run: cmake --install build

      - name: Deploy Qt and runtime libraries
        run: |
          set -e
          ./translate.sh release ui
          cp -v *.qm ${DEPLOY_DIR}/
          cd ${DEPLOY_DIR}
          WINDEPLOYQT=$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt || true)
          [ -n "$WINDEPLOYQT" ] || WINDEPLOYQT=$(ls ${MINGW_PREFIX}/share/qt6/bin/windeployqt*.exe | head -n1)
          echo "windeployqt: $WINDEPLOYQT"
          "$WINDEPLOYQT" --release --no-translations \
            qlcconsole.exe qlcconsole-fixtureeditor.exe \
            qlcplusengine.dll qlcplusui.dll qlcpluswebaccess.dll Plugins/dmxusb.dll
          # MSYS2's Qt is linked against shared system libraries windeployqt
          # knows nothing about. ldd lists the whole dependency closure; copy
          # in everything that resolves into the MSYS2 prefix.
          find . \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
            | xargs -0 -n1 ldd 2>/dev/null \
            | awk '{print $3}' | grep -i "^${MINGW_PREFIX}/bin/" | sort -u \
            | while read dll; do [ -e "$(basename "$dll")" ] || cp -v "$dll" . ; done
          # Fail here, not on a user's machine: anything still unresolved?
          if find . \( -iname '*.exe' -o -iname '*.dll' \) -print0 | xargs -0 -n1 ldd 2>/dev/null | grep -i "not found"; then
            echo "Unresolved DLLs remain in the deploy dir" ; exit 1
          fi

      - name: Smoke test
        run: |
          cd ${DEPLOY_DIR}
          # Run from the deploy dir with the MSYS2 prefix OFF the PATH, so
          # a DLL missing from the installer fails here.
          # --version prints and exits before any window is created.
          PATH=/c/Windows/system32:/c/Windows /usr/bin/timeout 120 ./qlcconsole.exe --version > /tmp/qlcconsole-version.txt 2>&1 || true
          cat /tmp/qlcconsole-version.txt
          grep -q "qlcconsole ${QLCCONSOLE_VERSION}" /tmp/qlcconsole-version.txt

      - name: Build installation package
        run: |
          cd ${DEPLOY_DIR}
          sh ${GITHUB_WORKSPACE}/platforms/windows/nsis-manifest.sh
          makensis -V3 -X'SetCompressor /FINAL lzma' qlcconsole.nsi
          mv -v qlcconsole-${QLCCONSOLE_VERSION}-win64-setup.exe \
            ${GITHUB_WORKSPACE}/qlcconsole-${QLCCONSOLE_VERSION}-${BUILD_DATE}-${GIT_REV}-win64-setup.exe

      - name: Store installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qlcconsole-${{env.QLCCONSOLE_VERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}-win64-setup.exe
          path: qlcconsole-${{env.QLCCONSOLE_VERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}-win64-setup.exe
          if-no-files-found: error

      # Informational, after the artifact on purpose: the suite does not pass
      # on Windows yet (TODO.md lists the failures), and a failing test there
      # should not withhold the installer. Runs every test binary rather than
      # stopping at the first failure like unittest.sh, and lists them all.
      # (unittest.sh itself also works under MSYS2: ./unittest.sh ui build.)
      - name: Test (informational)
        continue-on-error: true
        timeout-minutes: 45
        run: |
          ./unittest.sh ui build > /tmp/unittest.log 2>&1 || true   # stages resources for the tests
          grep -E "^Fixtures|definitions processed|^Fixturesmap" /tmp/unittest.log || true
          DLLDIRS=$(find "$PWD/build" -name '*.dll' -not -path '*/CMakeFiles/*' -exec dirname {} \; | sort -u | tr '\n' ':')
          FAILED=""
          PASSED=0
          for t in $(find build -name '*_test.exe' -not -path '*/CMakeFiles/*' | sort); do
            rc=0
            ( cd "$(dirname "$t")" && PATH="${DLLDIRS}${PATH}" QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 \
                /usr/bin/timeout 300 "./$(basename "$t")" > /tmp/t.log 2>&1 ) || rc=$?
            if [ $rc -ne 0 ]; then
              FAILED="$FAILED $(basename "$t" .exe)($rc)"
              echo "=== $t exit $rc"
              grep -E -A3 "^FAIL!|^QFATAL" /tmp/t.log | head -40 || true
              # A crash: which test function it was in, then the trace.
              [ $rc -gt 128 ] && { grep -E "^(PASS|FAIL!|SKIP|QDEBUG|QINFO|QWARN|QCRITICAL)" /tmp/t.log \
                                     | tail -n 12; tail -n 30 /tmp/t.log; } || true
            else
              PASSED=$((PASSED + 1))
            fi
          done
          echo "Passed: $PASSED test binaries"
          echo "Failed:$FAILED"
          [ -z "$FAILED" ]

      # The rig view on Direct3D 11 (the runner has no GPU: WARP), drawn
      # both ways, the pictures kept to look at: the GPU-vs-CPU test, and a
      # real show lit. Plus a bundle that runs the same headless on another
      # Windows machine (monitor_test + the deployed app + offscreen).
      - name: Rig view renders (informational)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          SHOTS=${GITHUB_WORKSPACE}/rig-shots
          mkdir -p $SHOTS
          DLLDIRS=$(find "$PWD/build" -name '*.dll' -not -path '*/CMakeFiles/*' -exec dirname {} \; | sort -u | tr '\n' ':')
          T=$(find build -name 'monitor_test.exe' -not -path '*/CMakeFiles/*' | head -n1)
          cd "$(dirname "$T")"
          run() { PATH="${DLLDIRS}${PATH}" QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 \
                    /usr/bin/timeout 600 ./monitor_test.exe "$@" 2>&1 \
                  | grep -E "RhiRaster|quality|rig view|^PASS|^FAIL|^SKIP|^QFATAL|Totals|   Loc" || true; }
          QLC_RIG_GPU=1 QLC_GPU_SHOTS=$SHOTS run theGpuDrawsWhatTheCpuDraws
          for gpu in 0 1; do
            QLC_RIG_GPU=$gpu QLC_RIG_BENCH=${GITHUB_WORKSPACE}/test-workspaces/DanceHysteria-0.1.qlcc \
              QLC_RIG_BENCH_DEFS=${GITHUB_WORKSPACE}/resources/fixtures QLC_RIG_BENCH_LIT=1 \
              QLC_RIG_BENCH_SHOT=$SHOTS/dancehysteria-gpu$gpu.png run aShowsRigViewDrawTime
          done
          ls -l $SHOTS
          # The bundle: monitor_test beside the deployed app and its DLLs.
          B=${GITHUB_WORKSPACE}/rig-test-bundle
          mkdir -p $B
          cp -r ${DEPLOY_DIR}/. $B/
          cp -v monitor_test.exe $B/
          mkdir -p $B/platforms
          cp -v ${MINGW_PREFIX}/share/qt6/plugins/platforms/qoffscreen.dll $B/platforms/
          cd $B
          ldd monitor_test.exe platforms/qoffscreen.dll | awk '{print $3}' | grep -i "^${MINGW_PREFIX}/bin/" | sort -u \
            | while read dll; do [ -e "$(basename "$dll")" ] || cp -v "$dll" . ; done

      - name: Store rig view renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rig-shots-windows
          path: rig-shots
          if-no-files-found: warn

      - name: Store rig test bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rig-test-bundle-windows
          path: rig-test-bundle
          if-no-files-found: warn

  build-macos:
    runs-on: macos-15
    name: QLCplus macOS ${{matrix.task}}
    strategy:
      fail-fast: false
      matrix:
        # Widgets UI only: this fork keeps qmlui OFF and doesn't carry the
        # rebrand through qmlui/, so a build-v5 leg could only ever be red.
        task: [build-v4]
    env:
      CI_REPO_SLUG: ${{ github.repository }}
      CI_BRANCH: ${{ github.head_ref }}
      CI_PULL_REQUEST: ${{ github.event.number }}
      QT_VERSION: "6.9.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          # APPVERSION counts commits since the fork point; the default shallow
          # clone yields 0, so artifacts came out as "...+qlcconsole.0".
          fetch-depth: 0

      - name: Set ENV variables
        shell: bash
        run: |
          echo "BUILD_DATE=`date -u '+%Y%m%d'`" >> $GITHUB_ENV
          echo "GIT_REV=`git rev-parse --short HEAD`" >> $GITHUB_ENV
          echo "QTDIR=${{ github.workspace }}/qt/Qt/${{ env.QT_VERSION }}/macos" >> $GITHUB_ENV
          echo "NPROC=`sysctl -n hw.ncpu`" >> $GITHUB_ENV

      - name: Set v4 ENV variables
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |

      - name: Print ENV vars
        shell: bash
        run: |
          echo "CI_BRANCH: ${CI_BRANCH}"
          echo "CI_PULL_REQUEST: ${CI_PULL_REQUEST}"
          echo "CI_REPO_SLUG: ${CI_REPO_SLUG}"
          echo "CI_EVENT_TYPE: ${CI_EVENT_TYPE}"
          echo "CI_SECURE_ENV_VARS: ${CI_SECURE_ENV_VARS}"
          echo "TASK: ${TASK}"
          echo "QTDIR: ${QTDIR}"
          echo "NPROC: ${NPROC}"

      - name: Dependencies
        run: |
          brew update
          brew install fftw mad libsndfile libftdi
          # Upstream pinned `brew link --overwrite python@3.13` to work around a
          # runner python/brew link clash. The image no longer ships that keg
          # ("No such keg: /opt/homebrew/Cellar/python@3.13") and the hard
          # failure killed the job three steps before Configure. Relink
          # whatever python brew actually has, and never fail the build on it.
          brew link --overwrite --force python3 2>/dev/null || true
    
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          dir: "${{ github.workspace }}/qt/"
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qt3d qtimageformats qtmultimedia qtserialport qtwebsockets qtshadertools'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        if: false

      - name: Configure v4 build
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |-
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QTDIR }}/lib/cmake" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        shell: bash
        run: |-
          cd build
          make -j${{ env.NPROC }}

      # macOS had no test step at all -- it built, packaged and uploaded a DMG
      # without ever running the suite, so nothing here could fail on a broken
      # build. This is the same gate the Linux jobs run.
      # Must run AFTER Install Qt, not in Dependencies: that action puts its own
      # python ahead on PATH, so lxml installed earlier lands in a different
      # interpreter than the one fixtures-tool.py's `#!/usr/bin/env python3`
      # resolves to at test time. Installing it here guarantees they match.
      - name: Install lxml for fixtures-tool
        shell: bash
        run: |
          echo "python3 is: $(command -v python3) -- $(python3 --version)"
          python3 -m pip install --break-system-packages lxml
          python3 -c 'import lxml.etree; print("lxml", lxml.etree.__version__, "importable")'

      - name: Test
        shell: bash
        run: cmake --build build --target check

      - name: Install
        shell: bash
        run: |-
          cd build
          make install/fast

      - name: Set APPVERSION
        shell: bash
        run: |-
          APPVERSION=$(awk -F\" '/^#define APPVERSION/ {gsub(/ /,"-",$2); print $2}' engine/src/qlcconfig.h)
          echo "APPVERSION=$APPVERSION" >> $GITHUB_ENV

      - name: Fix v4 dylib dependencies
        shell: bash
        if: ${{ matrix.task == 'build-v4' }}
        run: |-
          platforms/macos/fix_dylib_deps.sh ~/qlcconsole.app/Contents/Frameworks/libsndfile.1.dylib
          platforms/macos/fix_dylib_deps.sh ~/qlcconsole.app/Contents/MacOS/qlcconsole
          platforms/macos/fix_dylib_deps.sh ~/qlcconsole.app/Contents/MacOS/qlcconsole-fixtureeditor
          ${{ env.QTDIR }}/bin/macdeployqt ~/qlcconsole.app

      - name: Create DMG
        # Use retry loop to work around a race condition on macOS causing
        # 'Resource busy' errors with 'hdiutil'. See
        # https://github.com/actions/runner-images/issues/7522
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 12
          retry_wait_seconds: 1
          command: |
            OUTDIR=$PWD
            cd platforms/macos/dmg
            ./create-dmg --volname "qlcconsole ${{env.APPVERSION}}" \
            --volicon $OUTDIR/resources/icons/qlcconsole.icns \
            --background background.png \
            --window-size 400 300 \
            --window-pos 200 100 \
            --icon-size 64 \
            --icon "qlcconsole" 0 150 \
            --app-drop-link 200 150 \
            $OUTDIR/qlcconsole_${{ matrix.task }}.dmg \
            ~/qlcconsole.app

      - name: Store DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: qlcconsole-${{env.APPVERSION}}-${{env.BUILD_DATE}}-${{env.GIT_REV}}.dmg
          path: qlcconsole_${{ matrix.task }}.dmg
