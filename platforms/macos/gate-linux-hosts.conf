# The Linux hosts the gate's Linux leg can run on (platforms/macos/gate-linux.sh,
# started by gate-pool.sh). One host a line, whitespace between the columns:
#
#   name   what the result line calls it (linux_host=NAME)
#   ssh    ssh destination, key-based, no password
#
# The leg takes the FIRST host listed that is reachable, has cmake, ninja,
# ccache, g++ and Qt 6 (qtpaths6 or qmake6) and no gate running (its
# ~/gates/.gatelock, gate-lock.sh); if all are busy it waits for whichever
# frees first, gates served in the order they started waiting. Put the faster
# host first. GATE_LINUX_HOST=user@ip overrides this file with that one host.
# Each host needs: the Mac's ssh key in authorized_keys, and ccache + ninja +
# Qt 6.8 dev packages; copies go to ~/gates/<id> there.
#
# name               ssh
buildhost-qlcplus    branson@192.168.1.245
