# The Macs a gate can run on (platforms/macos/gate-pool.sh; ./check-all.sh
# --remote). One host a line, whitespace between the columns:
#
#   name      what the gate line calls it (host=NAME) and --remote NAME picks
#   ssh       ssh destination (key-based, no password), or "local" for the
#             Mac the pool is run from
#   qt        QT6_PREFIX there: the Qt the gate builds and tests with (~ is
#             that host's home)
#   path      directories put in front of PATH there, or -: where cmake,
#             ccache and a python3 WITH lxml are (the fixture check needs it;
#             macOS's own /usr/bin/python3 has none, and an ssh session's
#             PATH is not your terminal's)
#   minutes   about how long a cold full gate takes there with nothing else
#             running: auto weighs a host's load by it, so an idle fast Mac
#             wins over an idle slow one
#
# Copies go to ~/gates/<sha>-<time> on the host and are removed after; the
# host's own checkouts are never touched. Each host's notes (what was
# installed, quirks): the remote-gate-hosts memory file.
#
# name     ssh                      qt                       path            minutes
ender      local                    /opt/homebrew/opt/qt6    -               15
