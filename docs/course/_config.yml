# The course website (GitHub Pages), built by .github/workflows/pages.yml
# from main. See COURSE_PLAN.md section 6.
title: Show Tree course
description: Lighting a show choir with qlcconsole's Show Tree — a course for high-school tech crews.
remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
search_enabled: true
color_scheme: dark
aux_links:
  "qlcconsole on GitHub": "https://github.com/sandinak/qlcconsole"
# Teacher material is read on GitHub, not on the site (Q187); the
# check in tools/student-pages.py --site fails if any of it is built.
exclude:
  - COURSE_PLAN.md
  - VOLUNTEER.md
  - _template/
  - level-*/lesson-*/teacher-guide.md
  - level-*/lesson-*/slides.md
  - tools/
  - shows/README.md
  - Gemfile
  - Gemfile.lock
footer_content: "Course text and pictures: CC BY 4.0. Show files and scripts: Apache-2.0, as qlcconsole is."
