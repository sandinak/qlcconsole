<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1e22"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="glowBottomA" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#ff8a1f" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capA" x1="0" y1="0" x2="0" y2="1">
