<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="47" height="47" version="1">
  <defs>
    <linearGradient id="blueGrad">
      <stop offset="0" style="stop-color:#415ecb;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="outerFill" xlink:href="#blueGrad" cx="23.5" cy="23.5" r="14" gradientUnits="userSpaceOnUse"/>
    <radialGradient id="midFill"   xlink:href="#blueGrad" cx="23.5" cy="23.5" r="9"  gradientUnits="userSpaceOnUse"/>
  </defs>
  <!-- Outer ring -->
  <circle cx="23.5" cy="23.5" r="21" fill="none" stroke="url(#outerFill)" stroke-width="5"/>
  <!-- Middle ring -->
  <circle cx="23.5" cy="23.5" r="13" fill="none" stroke="url(#midFill)"   stroke-width="4"/>
  <!-- Crosshair -->
  <line x1="23.5" y1="3"    x2="23.5" y2="44"   stroke="#103577" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="3"    y1="23.5" x2="44"   y2="23.5"  stroke="#103577" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="23.5" cy="23.5" r="3.5" fill="#ffffff" stroke="#103577" stroke-width="0.8"/>
</svg>
